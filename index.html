<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro Curso Gratis - Hugo Alvigini</title>

    n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
    document,'script','https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '2189151328193841');

  </script>
  
 <style>
  :root { 
    --primary: #1e3c72; 
    --success: #5cb85c; 
    --text: #64748b; 
    --dark-bg: #1e293b;
  }
  
  body { 
    font-family: 'Open Sans', sans-serif; 
    background: linear-gradient(rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.75)), 
                url('https://res.cloudinary.com/dlnrsadbc/image/upload/f_auto,q_auto:eco/v1778806730/FOTO_LOGIN_PLATAFORMA_ok3et0_1_prky3q_2_usiyrh.webp');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    display: flex; 
    justify-content: center; 
    align-items: center; 
    min-height: 100vh; 
    margin: 0; 
    padding: 20px; 
    box-sizing: border-box; 
  }

  .card { 
    background: rgba(255, 255, 255, 0.96);
    border-radius: 24px; 
    box-shadow: 0 30px 60px rgba(0,0,0,0.5); 
    width: 100%; 
    max-width: 850px; 
    display: flex; 
    flex-direction: row;
    overflow: hidden;
    backdrop-filter: blur(12px);
    margin-top: 160px; /* Ajustado para que bajen un poco más los emprendedores */
  }

  .card-left {
    flex: 1;
    background: #f8fafc;
    padding: 40px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    border-right: 1px solid #e2e8f0;
  }

  .logo { 
    width: 160px; 
    height: 160px; 
    border-radius: 50%; 
    border: 5px solid white; 
    object-fit: cover; 
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    margin-bottom: 20px;
  }

  .card-right {
    flex: 1.2;
    padding: 40px;
    text-align: left;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  h2 { color: var(--dark-bg); margin: 0 0 10px 0; font-size: 24px; font-weight: 700; }
  p { color: var(--text); margin-bottom: 20px; font-size: 15px; line-height: 1.5; }
  
  input { 
    width: 100%; 
    padding: 12px 16px; 
    margin: 6px 0; 
    border: 1px solid #e2e8f0; 
    border-radius: 12px; 
    box-sizing: border-box; 
    font-size: 15px; 
    background: white;
    outline: none;
  }

  input:focus { border-color: var(--primary); }

  button { 
    width: 100%; 
    background: var(--success); 
    color: white; 
    border: none; 
    padding: 16px; 
    border-radius: 12px; 
    font-weight: bold; 
    cursor: pointer; 
    font-size: 16px; 
    margin-top: 15px; 
    text-transform: uppercase;
    transition: all 0.3s ease;
  }

  button:hover { background: #4cae4c; transform: translateY(-2px); }
  button:disabled { background: #cbd5e1; cursor: not-allowed; }

  @media (max-width: 768px) {
    .card { flex-direction: column; margin-top: 20px; max-width: 400px; }
    .card-left { border-right: none; border-bottom: 1px solid #e2e8f0; padding: 30px; }
    .logo { width: 120px; height: 120px; }
  }

  #mensaje { 
    display: none; 
    color: #059669; 
    background: #ecfdf5; 
    padding: 15px; 
    border-radius: 12px; 
    border: 1px solid #a7f3d0; 
    margin-top: 20px;
    font-weight: bold;
    text-align: center;
  }
</style>
  
</head>
<body>

  <div class="card">
    <div class="card-left">
      <img src="https://res.cloudinary.com/dlnrsadbc/image/upload/f_auto,q_auto/v1778806879/Gemini_Generated_Image_nm1t21nm1t21nm1t_s7w9li_1_1_uos6ak.webp" class="logo" alt="Hugo Alvigini">
      <div style="text-align: center;">
        <h2>🚀 ¡Hacé tus procesos inteligentes!</h2>
        <p>Accedé al curso gratuito de Google Sheets.</p>
      </div>
    </div>

    <div class="card-right">
      <form id="regForm">
        <input type="text" name="nombre" placeholder="Tu Nombre" required>
        <input type="text" name="apellido" placeholder="Tu Apellido" required>
        <input type="email" name="email" placeholder="Tu mejor Email" required>
        <input type="text" name="pais" placeholder="Tu País" required>
        <button type="submit" id="btnEnvio">SOLICITAR ACCESO GRATIS</button>
      </form>
      
      <div id="mensaje">
        ✨ ¡Genial! Registro exitoso.<br>
        <small style="font-weight: normal;">Revisá tu email en unos minutos.</small>
      </div>
    </div>
  </div>

 <script>
  // Tu URL de Web App (Asegurate que sea la de la última implementación)
  const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwdqWmXR9VC3e2jDD-7aWyb26T89BRMswxS7-ORH7vNnZKOHVPMus-yzwlwkctZcrlt/exec';

  document.getElementById('regForm').onsubmit = function(e) {
    e.preventDefault();
    const btn = document.getElementById('btnEnvio');
    btn.disabled = true;
    btn.innerText = 'PROCESANDO...';

    // Extraemos los datos del formulario
    const datos = {
      nombre: this.nombre.value,
      apellido: this.apellido.value,
      email: this.email.value,
      pais: this.pais.value
    };

    // Enviamos usando una URL con parámetros (método más confiable para Apps Script con GitHub Pages)
    const queryString = new URLSearchParams(datos).toString();
    
    fetch(`${WEB_APP_URL}?${queryString}`, {
      method: 'POST',
      mode: 'no-cors'
    })
    .then(() => {
      // Registro del evento en el Píxel de Meta
      if (typeof fbq !== 'undefined') {
        fbq('track', 'Lead'); 
      }
      
      document.getElementById('regForm').style.display = 'none';
      document.getElementById('mensaje').style.display = 'block';
    })
    .catch(error => {
      console.error('Error:', error);
      alert('Hubo un problema al enviar los datos. Intentá de nuevo.');
      btn.disabled = false;
      btn.innerText = 'SOLICITAR ACCESO GRATIS';
    });
  };
</script>
</body>
</html>
